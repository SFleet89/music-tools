<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duplicate Undo Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

  header { background: #1a1d2e; border-bottom: 1px solid #2d3148; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 17px; font-weight: 600; color: #fff; }
  header span { font-size: 13px; color: #64748b; margin-left: 4px; }
  .hbtn { background: #1a1d2e; border: 1px solid #2d3148; border-radius: 7px; color: #94a3b8; cursor: pointer; font-size: 12px; padding: 6px 12px; margin-left: auto; transition: all 0.15s; }
  .hbtn:hover { border-color: #6366f1; color: #e2e8f0; }

  #drop-zone { margin: 40px auto; max-width: 700px; border: 2px dashed #2d3148; border-radius: 16px; padding: 100px 60px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
  #drop-zone:hover, #drop-zone.drag-over { border-color: #6366f1; background: #1a1d2e; }
  #drop-zone svg { margin-bottom: 16px; opacity: 0.4; }
  #drop-zone p { color: #94a3b8; font-size: 14px; line-height: 1.7; }
  #drop-zone strong { color: #e2e8f0; }
  #file-input { display: none; }

  #app { display: none; padding: 20px 24px 40px; }

  /* ── Stats ── */
  .stats { display: flex; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat { background: #1a1d2e; border: 1px solid #2d3148; border-radius: 8px; padding: 10px 16px; font-size: 13px; }
  .stat strong { font-size: 20px; display: block; color: #fff; }
  .stat span { color: #64748b; }

  /* ── Pills ── */
  .pills { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .pill { padding: 5px 13px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; user-select: none; }
  .pill:hover { opacity: 0.85; }
  .pill.inactive { background: #1a1d2e !important; border-color: #2d3148 !important; color: #64748b !important; }
  .pill-exact   { background: #14532d22; border-color: #16a34a; color: #86efac; }
  .pill-dup     { background: #1e3a5f22; border-color: #3b82f6; color: #93c5fd; }
  .pill-better  { background: #3b1f6e22; border-color: #8b5cf6; color: #c4b5fd; }
  .pill-fp      { background: #7c2d1222; border-color: #dc2626; color: #fca5a5; }
  .pill-meta    { background: #1f293722; border-color: #475569; color: #94a3b8; }

  /* ── Controls ── */
  .controls { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  input[type=text], select { background: #1a1d2e; border: 1px solid #2d3148; border-radius: 8px; color: #e2e8f0; padding: 8px 12px; font-size: 13px; outline: none; }
  input[type=text] { width: 260px; }
  input[type=text]:focus, select:focus { border-color: #6366f1; }
  .btn { background: #1a1d2e; border: 1px solid #2d3148; border-radius: 8px; color: #94a3b8; padding: 8px 14px; font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .btn:hover { border-color: #6366f1; color: #e2e8f0; }
  .reset-btn { font-size: 12px; color: #6366f1; background: none; border: none; cursor: pointer; padding: 0; margin-left: auto; }
  .reset-btn:hover { text-decoration: underline; }
  #row-count { font-size: 13px; color: #64748b; margin-bottom: 10px; }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #2d3148; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th { background: #1a1d2e; color: #94a3b8; font-weight: 500; padding: 10px 14px; text-align: left; white-space: nowrap; cursor: pointer; user-select: none; border-bottom: 1px solid #2d3148; position: sticky; top: 0; z-index: 1; }
  thead th:hover { color: #e2e8f0; }
  thead th.sorted { color: #a5b4fc; }
  thead th.nosort { cursor: default; }
  thead th.nosort:hover { color: #94a3b8; }
  .sort-icon { margin-left: 4px; opacity: 0.35; font-size: 10px; }
  thead th.sorted .sort-icon { opacity: 1; }
  tbody tr { border-bottom: 1px solid #181c28; }
  tbody tr:hover { background: #1a1d2e55; }
  tbody td { padding: 9px 14px; vertical-align: top; }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .badge-exact  { background: #14532d; color: #86efac; }
  .badge-dup    { background: #1e3a5f; color: #93c5fd; }
  .badge-better { background: #3b1f6e; color: #c4b5fd; }

  .path-cell { font-family: "Consolas","Monaco",monospace; font-size: 11px; }
  .path-fname { color: #e2e8f0; font-size: 12px; display: block; margin-bottom: 3px; }
  .path-full  { color: #374151; font-size: 10px; display: block; }
  .path-full:hover { color: #64748b; }

  .method-cell { font-size: 11px; }
  .fp-badge { background: #7c2d1222; border: 1px solid #dc2626; color: #fca5a5; padding: 2px 8px; border-radius: 8px; font-size: 11px; }

  .status-ok      { color: #34d399; font-size: 11px; }
  .status-missing { color: #f87171; font-size: 11px; }
  .status-conflict{ color: #fbbf24; font-size: 11px; }

  .no-results { text-align: center; padding: 56px; color: #4b5563; font-size: 14px; }

  #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(10px); background: #1a1d2e; border: 1px solid #6366f1; color: #e2e8f0; padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 100; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2">
    <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.96"/>
  </svg>
  <h1>Duplicate Undo Viewer</h1>
  <span id="header-file"></span>
  <button id="load-new" class="hbtn" style="display:none" onclick="resetViewer()">⟳ Load new report</button>
  <button id="export-btn" style="display:none;background:none;border:1px solid #2d3148;border-radius:8px;color:#6366f1;cursor:pointer;font-size:13px;padding:6px 14px;margin-left:8px" onclick="exportCSV()">⬇ Export CSV</button>
</header>

<div id="drop-zone" onclick="document.getElementById('file-input').click()">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
  </svg>
  <p><strong>Drop a music_report_*_live_*.csv here</strong><br>or click to browse<br><br>
  Shows what was moved and lets you review before running undo_duplicates.py</p>
</div>
<input type="file" id="file-input" accept=".csv">

<div id="app">
  <div class="stats" id="stats"></div>
  <div class="pills" id="pills"></div>
  <div class="controls">
    <input type="text" id="search" placeholder="Search filename, path…">
    <select id="sort-col">
      <option value="Category">Sort by category</option>
      <option value="Unsorted Path">Sort by filename</option>
      <option value="Match Method">Sort by method</option>
    </select>
    <select id="sort-dir">
      <option value="asc">Ascending</option>
      <option value="desc">Descending</option>
    </select>
    <button class="btn" onclick="clearFilters()">Clear filters</button>
    <button class="reset-btn" onclick="copyUndoCommand()">Copy undo command</button>
  </div>
  <div id="row-count"></div>
  <div class="table-wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="no-results" id="no-results" style="display:none">No rows match the current filters.</div>
  </div>
</div>

<div id="toast"></div>

<script>
let allRows  = [];
let csvHeaders = [];
let movedRows = [];
let sortCol  = 'Category';
let sortAsc  = true;
let activeCats    = new Set();
let activeMethods = new Set();
let csvFilename   = '';

// ── CSV parser ──
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const lines = text.split(/\r?\n/);
  const headers = splitLine(lines[0]).map(h=>h.trim());
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = splitLine(lines[i]);
    const row = {};
    headers.forEach((h, j) => { row[h] = (vals[j] || '').trim(); });
    rows.push(row);
  }
  return { headers, rows };
}
function splitLine(line) {
  const out = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1]==='"') { cur+='"'; i++; } else inQ=!inQ; }
    else if (c === ',' && !inQ) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

function wasMoved(action) {
  const a = (action || '').trim().toLowerCase();
  return (a.startsWith('auto-moved') || a.startsWith('moved to')) && !a.includes('would');
}

function isFP(method) {
  return (method || '').toLowerCase().includes('fingerprint');
}

function fname(path) {
  return (path || '').replace(/\\/g, '/').split('/').pop() || path;
}

// ── Load ──
function loadFile(file) {
  csvFilename = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    const parsed = parseCSV(e.target.result);
    allRows = parsed.rows;
    csvHeaders = parsed.headers;
    movedRows = allRows.filter(r => wasMoved(r['Action'] || ''));
    document.getElementById('header-file').textContent = file.name;
    document.getElementById('drop-zone').style.display = 'none';
    document.getElementById('app').style.display       = 'block';
    document.getElementById('load-new').style.display  = 'inline';
    buildStats();
    buildPills();
    render();
  };
  reader.readAsText(file, 'utf-8');
}

// ── Stats ──
function buildStats() {
  const total   = movedRows.length;
  const cats    = [...new Set(movedRows.map(r => r['Category']))];
  const methods = [...new Set(movedRows.map(r => r['Match Method']))];
  document.getElementById('stats').innerHTML = `
    <div class="stat"><strong>${total.toLocaleString()}</strong><span>Files moved</span></div>
    <div class="stat"><strong>${cats.length}</strong><span>Categories</span></div>
    <div class="stat"><strong>${allRows.length.toLocaleString()}</strong><span>Total rows in report</span></div>
  `;
}

// ── Pills ──
const CAT_PILL = {
  'Exact Match':          'pill-exact',
  'DUPLICATE':            'pill-dup',
  'Standard Duplicate':   'pill-dup',
  'BETTER QUALITY':       'pill-better',
  'Higher Quality Match': 'pill-better',
};
const CAT_BADGE = {
  'Exact Match':          'badge-exact',
  'DUPLICATE':            'badge-dup',
  'Standard Duplicate':   'badge-dup',
  'BETTER QUALITY':       'badge-better',
  'Higher Quality Match': 'badge-better',
};

function buildPills() {
  const c = document.getElementById('pills');
  c.innerHTML = '';

  // Category pills
  const catCounts = {};
  movedRows.forEach(r => { const cat = r['Category']||''; catCounts[cat] = (catCounts[cat]||0)+1; });
  Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).forEach(([cat, count]) => {
    const p = document.createElement('div');
    p.className = `pill ${CAT_PILL[cat]||'pill-meta'}`;
    p.textContent = `${cat} (${count})`;
    p.onclick = () => { toggleSet(activeCats, cat); p.classList.toggle('inactive', !activeCats.has(cat)); render(); };
    c.appendChild(p);
  });

  // FP pill
  const fpCount = movedRows.filter(r => isFP(r['Match Method'])).length;
  if (fpCount) {
    const p = document.createElement('div');
    p.className = 'pill pill-fp';
    p.textContent = `Fingerprint (${fpCount})`;
    p.onclick = () => { toggleSet(activeMethods, 'fp'); p.classList.toggle('inactive', !activeMethods.has('fp')); render(); };
    c.appendChild(p);
  }
}

function toggleSet(s, v) { s.has(v) ? s.delete(v) : s.add(v); }

// ── Filter + render ──
function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const sc = document.getElementById('sort-col').value;
  const sd = document.getElementById('sort-dir').value;

  let rows = movedRows;

  if (activeCats.size > 0)
    rows = rows.filter(r => activeCats.has(r['Category']||''));
  if (activeMethods.has('fp'))
    rows = rows.filter(r => isFP(r['Match Method']));
  if (q)
    rows = rows.filter(r =>
      (r['Unsorted Path']||'').toLowerCase().includes(q) ||
      (r['Destination Path']||'').toLowerCase().includes(q) ||
      (r['Match Path']||'').toLowerCase().includes(q)
    );

  return rows.slice().sort((a, b) => {
    let va = (a[sc]||'').toLowerCase();
    let vb = (b[sc]||'').toLowerCase();
    if (va < vb) return sd==='asc' ? -1 : 1;
    if (va > vb) return sd==='asc' ?  1 : -1;
    return 0;
  });
}

const COLS = [
  { key: 'Category',     label: 'Category',   sort: true  },
  { key: 'Match Method', label: 'Method',      sort: true  },
  { key: '_unsorted',    label: 'Unsorted file (original location)', sort: false },
  { key: '_dest',        label: 'Current location (moved to)',       sort: false },
  { key: '_match',       label: 'Library match',                      sort: false },
];

function buildHeader() {
  const tr = document.createElement('tr');
  COLS.forEach(col => {
    const th = document.createElement('th');
    if (!col.sort) { th.className = 'nosort'; th.textContent = col.label; }
    else {
      const sorted = sortCol === col.key;
      if (sorted) th.classList.add('sorted');
      th.innerHTML = `${col.label}<span class="sort-icon">${sorted?(sortAsc?'▲':'▼'):'⇅'}</span>`;
      th.onclick = () => { sortCol===col.key ? sortAsc=!sortAsc : (sortCol=col.key, sortAsc=true); render(); };
    }
    tr.appendChild(th);
  });
  document.getElementById('thead').innerHTML = '';
  document.getElementById('thead').appendChild(tr);
}

function pathCell(path) {
  if (!path) return '<span style="color:#374151">—</span>';
  return `<div class="path-cell">
    <span class="path-fname">${esc(fname(path))}</span>
    <span class="path-full" title="${esc(path)}">${esc(path.length>75?'…'+path.slice(-73):path)}</span>
  </div>`;
}

function render() {
  buildHeader();
  const rows  = getFiltered();
  const tbody = document.getElementById('tbody');
  const noRes = document.getElementById('no-results');
  document.getElementById('row-count').textContent =
    `Showing ${rows.length.toLocaleString()} of ${movedRows.length.toLocaleString()} moved files`;

  if (!rows.length) { tbody.innerHTML=''; noRes.style.display='block'; return; }
  noRes.style.display = 'none';

  tbody.innerHTML = rows.map(r => {
    const cat    = r['Category']||'';
    const method = r['Match Method']||'';
    const dest   = r['Destination Path']||'';
    const badge  = `<span class="badge ${CAT_BADGE[cat]||''}">${esc(cat)}</span>`;
    const mCell  = isFP(method)
      ? `<span class="fp-badge">${esc(method)}</span>`
      : `<span class="method-cell">${esc(method||'—')}</span>`;
    return `<tr>
      <td>${badge}</td>
      <td>${mCell}</td>
      <td>${pathCell(r['Unsorted Path'])}</td>
      <td>${pathCell(dest)}</td>
      <td>${pathCell(r['Match Path'])}</td>
    </tr>`;
  }).join('');
}

// ── Copy undo command ──
function copyUndoCommand() {
  const cmd = `python undo_duplicates.py "${csvFilename}"`;
  navigator.clipboard.writeText(cmd).then(() => toast('Command copied to clipboard!'));
}

function clearFilters() {
  activeCats.clear(); activeMethods.clear();
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('inactive'));
  document.getElementById('search').value = '';
  sortCol = 'Category'; sortAsc = true;
  document.getElementById('sort-col').value = 'Category';
  document.getElementById('sort-dir').value = 'asc';
  render();
}

function resetViewer() {
  allRows=[]; movedRows=[]; activeCats.clear(); activeMethods.clear(); csvFilename=''; csvHeaders=[];
  document.getElementById('drop-zone').style.display = 'block';
  document.getElementById('app').style.display       = 'none';
  document.getElementById('load-new').style.display  = 'none';
  document.getElementById('header-file').textContent = '';
  document.getElementById('file-input').value        = '';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Events ──
document.getElementById('file-input').addEventListener('change', e => { if(e.target.files[0]) loadFile(e.target.files[0]); });
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', ()  => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
document.getElementById('search').addEventListener('input', render);
document.getElementById('sort-col').addEventListener('change', e => { sortCol=e.target.value; render(); });
document.getElementById('sort-dir').addEventListener('change', e => { sortAsc=e.target.value==='asc'; render(); });

function exportCSV() {
  if (!allRows.length) return;
  const headers = csvHeaders.length ? csvHeaders : Object.keys(allRows[0]);
  const esc = v => {
    v = String(v ?? '');
    if (v.includes(',') || v.includes('"') || v.includes('\n') || v.includes('\r')) {
      return '"' + v.replace(/"/g, '""') + '"';
    }
    return v;
  };
  const lines = [
    headers.map(esc).join(','),
    ...allRows.map(r => headers.map(h => esc(r[h] ?? '')).join(','))
  ];
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const ts = new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
  a.download = 'exported_' + (csvFilename.replace('.csv','') || 'report') + '_' + ts + '.csv';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

</script>
</body>
</html>
