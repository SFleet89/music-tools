<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Tools — Report Viewer</title>
<style>
/* ── Design tokens ─────────────────────────────────────────────────────────── */
:root {
  --bg:          #f5f5f5;
  --surface:     #ffffff;
  --border:      #e0e0e0;
  --border-dark: #c0c0c0;
  --text:        #1a1a1a;
  --text-muted:  #666666;
  --accent:      #2563eb;
  --accent-dim:  #eff6ff;
  --row-alt:     #fafafa;
  --row-hover:   #f0f4ff;

  --green-bg:  #dcfce7; --green-fg:  #166534;
  --amber-bg:  #fef9c3; --amber-fg:  #854d0e;
  --red-bg:    #fee2e2; --red-fg:    #991b1b;
  --grey-bg:   #f3f4f6; --grey-fg:   #374151;
  --blue-bg:   #dbeafe; --blue-fg:   #1e40af;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Cascadia Code", "Consolas", monospace;
  --radius: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.10);

  --font-size:   13px;
  --thead-bg:    #f0f0f0;
  --thead-hover: #e5e5e5;
}

/* ── Dark theme ─────────────────────────────────────────────────────────────── */
[data-theme="dark"] {
  --bg:          #111827;
  --surface:     #1f2937;
  --border:      #374151;
  --border-dark: #4b5563;
  --text:        #f9fafb;
  --text-muted:  #9ca3af;
  --accent:      #3b82f6;
  --accent-dim:  #1e3a5f;
  --row-alt:     #18242f;
  --row-hover:   #1e3048;
  --shadow:      0 1px 3px rgba(0,0,0,.40);

  --thead-bg:    #374151;
  --thead-hover: #4b5563;

  --green-bg: #052e16; --green-fg: #4ade80;
  --amber-bg: #451a03; --amber-fg: #fbbf24;
  --red-bg:   #450a0a; --red-fg:   #f87171;
  --grey-bg:  #1f2937; --grey-fg:  #d1d5db;
  --blue-bg:  #1e3a5f; --blue-fg:  #60a5fa;
}

/* ── Reset ─────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); font-size: var(--font-size); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

/* ── Layout ────────────────────────────────────────────────────────────────── */
#app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 10;
}
#app-header h1 { font-size: 15px; font-weight: 600; color: var(--accent); white-space: nowrap; }
#report-type-label {
  font-size: 12px;
  background: var(--accent-dim);
  color: var(--accent);
  border-radius: 20px;
  padding: 2px 10px;
  font-weight: 500;
  white-space: nowrap;
}
#controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }
#search-box {
  padding: 5px 10px; border: 1px solid var(--border-dark);
  border-radius: var(--radius); font-size: 13px; width: 220px;
  outline: none; font-family: var(--font); color: var(--text); background: var(--surface);
}
#search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
select.filter-select {
  padding: 5px 8px; border: 1px solid var(--border-dark); border-radius: var(--radius);
  font-size: 13px; background: var(--surface); color: var(--text); cursor: pointer; font-family: var(--font);
}
button.btn {
  padding: 5px 12px; border-radius: var(--radius); border: 1px solid var(--border-dark);
  background: var(--surface); cursor: pointer; font-size: 13px; font-family: var(--font);
  color: var(--text); white-space: nowrap;
}
button.btn:hover { background: var(--row-alt); }
button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.btn.primary:hover { background: #1d4ed8; }

#row-count { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

/* ── Drop zone / empty state ───────────────────────────────────────────────── */
#drop-zone {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 40px;
  text-align: center;
}
#drop-zone.drag-over { background: var(--accent-dim); }
#drop-zone .icon { font-size: 48px; }
#drop-zone h2 { font-size: 20px; font-weight: 600; color: var(--text); }
#drop-zone p { color: var(--text-muted); max-width: 400px; line-height: 1.5; }
#file-input { display: none; }

/* ── Table wrapper ─────────────────────────────────────────────────────────── */
#table-wrapper {
  flex: 1;
  overflow: auto;
  display: none;
}
#data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--font-size);
}
#data-table thead {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--thead-bg);
}
#data-table th {
  padding: 8px 10px;
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid var(--border-dark);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  border-right: 1px solid var(--border);
  position: relative;
}
#data-table th:hover { background: var(--thead-hover); }
#data-table th.sorted-asc::after  { content: " ▲"; font-size: 10px; }
#data-table th.sorted-desc::after { content: " ▼"; font-size: 10px; }
#data-table td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  max-width: 320px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: top;
}
#data-table td.wrap { white-space: normal; word-break: break-word; }
#data-table tr:nth-child(even) td { background: var(--row-alt); }
#data-table tr:hover td { background: var(--row-hover); }
#data-table td.mono { font-family: var(--font-mono); font-size: 12px; }
#data-table td.num  { text-align: right; font-family: var(--font-mono); font-size: 12px; }

/* ── Status badges ─────────────────────────────────────────────────────────── */
.badge {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-green { background: var(--green-bg); color: var(--green-fg); }
.badge-amber { background: var(--amber-bg); color: var(--amber-fg); }
.badge-red   { background: var(--red-bg);   color: var(--red-fg);   }
.badge-grey  { background: var(--grey-bg);  color: var(--grey-fg);  }
.badge-blue  { background: var(--blue-bg);  color: var(--blue-fg);  }

/* ── Score bar ─────────────────────────────────────────────────────────────── */
.score-bar-wrap { display: flex; align-items: center; gap: 6px; min-width: 90px; }
.score-bar { height: 6px; border-radius: 3px; flex: 1; background: var(--border); overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .2s; }
.score-val { font-size: 11px; color: var(--text-muted); min-width: 28px; text-align: right; font-family: var(--font-mono); }

/* ── Footer / pagination ───────────────────────────────────────────────────── */
#footer {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 20px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-muted);
  flex-wrap: wrap;
}
#footer .page-info { flex: 1; }
#page-btns { display: flex; gap: 4px; }
#page-btns button {
  padding: 3px 8px; border: 1px solid var(--border-dark); border-radius: 4px;
  background: var(--surface); cursor: pointer; font-size: 12px;
}
#page-btns button:hover { background: var(--row-alt); }
#page-btns button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
#page-btns button:disabled { opacity: .4; cursor: default; }

/* ── Column toggle panel ───────────────────────────────────────────────────── */
#col-panel {
  position: fixed; top: 55px; right: 12px;
  background: var(--surface); border: 1px solid var(--border-dark);
  border-radius: var(--radius); padding: 10px 14px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
  z-index: 20; display: none; max-height: 400px; overflow-y: auto; min-width: 200px;
}
#col-panel h3 { font-size: 12px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
#col-panel label { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 2px 0; cursor: pointer; }
#col-panel label:hover { color: var(--accent); }

/* ── Column resize handle ───────────────────────────────────────────────────── */
.col-resize-handle {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 5px;
  cursor: col-resize;
  z-index: 2;
}
.col-resize-handle:hover,
.col-resize-handle.resizing { background: var(--accent); opacity: 0.5; }

/* ── Accessibility controls ─────────────────────────────────────────────────── */
#a11y-controls {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
#a11y-controls .btn { padding: 4px 9px; font-size: 12px; min-width: 30px; text-align: center; }
#font-size-display {
  font-size: 11px;
  color: var(--text);
  min-width: 30px;
  text-align: center;
  pointer-events: none;
}

/* ── Scrollbar ─────────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #999; }

/* ── Tab bar ─────────────────────────────────────────────────────────────────── */
#tab-bar {
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  padding: 0 12px;
  display: flex;
  gap: 0;
  flex-shrink: 0;
  overflow-x: auto;
}
.tab-btn {
  padding: 9px 14px;
  border: none;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  background: none;
  cursor: pointer;
  font-size: 13px;
  font-family: var(--font);
  color: var(--text-muted);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab-count {
  font-size: 11px;
  background: var(--border);
  color: var(--text-muted);
  border-radius: 10px;
  padding: 1px 7px;
  font-weight: 500;
  min-width: 20px;
  text-align: center;
}
.tab-btn.active .tab-count { background: var(--accent-dim); color: var(--accent); }

/* ── Scan Progress Dashboard ────────────────────────────────────────────────── */
#custom-wrapper { flex: 1; overflow: auto; padding: 20px 24px 40px; }
.sp-cards { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.sp-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 18px; min-width: 130px; box-shadow: var(--shadow);
}
.sp-card-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.sp-card-value { font-size: 24px; font-weight: 700; font-family: var(--font-mono); }
.sp-card-sub   { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.sp-card-green  .sp-card-value { color: var(--green-fg); }
.sp-card-red    .sp-card-value { color: var(--red-fg); }
.sp-card-amber  .sp-card-value { color: var(--amber-fg); }
.sp-card-blue   .sp-card-value { color: var(--blue-fg); }
.sp-card-purple .sp-card-value { color: #7c3aed; }
[data-theme="dark"] .sp-card-purple .sp-card-value { color: #a78bfa; }

.sp-chart-section {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 20px; margin-bottom: 20px; box-shadow: var(--shadow);
}
.sp-chart-title { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .04em; }
.sp-chart-wrap  { position: relative; height: 200px; }
.sp-chart-wrap canvas { width: 100% !important; }

.sp-section-title { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em; }
.sp-table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; box-shadow: var(--shadow); }
.sp-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.sp-table thead th {
  background: var(--thead-bg); color: var(--text-muted); font-weight: 600;
  padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border-dark); white-space: nowrap;
}
.sp-table tbody tr { border-bottom: 1px solid var(--border); }
.sp-table tbody tr:hover td { background: var(--row-hover); }
.sp-table td { padding: 8px 12px; vertical-align: middle; }
.sp-num  { text-align: right; font-family: var(--font-mono); }
.sp-chg-pos  { color: var(--red-fg); }
.sp-chg-neg  { color: var(--green-fg); }
.sp-chg-zero { color: var(--text-muted); }
.sp-bar-cell { display: flex; align-items: center; gap: 8px; }
.sp-bar      { height: 6px; border-radius: 3px; flex-shrink: 0; min-width: 2px; }
.sp-bar-text { font-size: 11px; color: var(--text-muted); min-width: 55px; white-space: nowrap; }
.sp-no-data  { text-align: center; padding: 32px; color: var(--text-muted); font-size: 13px; }

/* ── Duplicates Decisions View ───────────────────────────────────────────────── */
.dup-pills-bar    { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
.dup-controls-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
.dup-cat-pill {
  background: var(--surface); border: 1px solid var(--border-dark);
  border-radius: 20px; padding: 4px 12px; font-size: 12px;
  display:inline-flex; align-items:center; gap:6px;
  cursor:pointer; white-space:nowrap; transition: border-color .12s;
}
.dup-cat-pill:hover, .dup-cat-pill.active {
  border-color: var(--accent); background: var(--accent-dim); color: var(--accent);
}
.dup-cat-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

.dup-tier-label { font-size:11px; color:var(--text-muted); }
.dup-tier-pill {
  padding: 3px 10px; border-radius:12px; font-size:11px; font-weight:600;
  cursor:pointer; border:1px solid; transition: all .12s; user-select:none;
}
.dup-tier-pill.tier-inactive { background:var(--surface) !important; border-color:var(--border) !important; color:var(--text-muted) !important; opacity:.45; }
.dup-tier-high   { background: var(--green-bg); border-color: var(--green-fg); color: var(--green-fg); }
.dup-tier-medium { background: var(--amber-bg); border-color: var(--amber-fg); color: var(--amber-fg); }
.dup-tier-low    { background: var(--red-bg);   border-color: var(--red-fg);   color: var(--red-fg);   }

.dup-table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; }
.dup-table { width:100%; border-collapse:collapse; font-size:12.5px; }
.dup-table thead th {
  background: var(--thead-bg); color: var(--text-muted); font-weight:600;
  padding: 8px 10px; text-align:left; border-bottom:1px solid var(--border-dark);
  white-space:nowrap; position:sticky; top:0; z-index:2;
}
.dup-table tbody tr { border-bottom: 1px solid var(--border); }
.dup-table tbody tr:hover td { background: var(--row-hover); }
.dup-table tbody tr.dup-decided td { background: var(--green-bg); }
[data-theme="dark"] .dup-table tbody tr.dup-decided td { background: #052e16; }
.dup-table td { padding: 7px 10px; vertical-align: top; }

.dup-path-cell { font-family:var(--font-mono); font-size:11px; color:var(--text-muted); max-width:230px; word-break:break-all; }
.dup-path-fname { color:var(--text); font-size:12px; font-family:var(--font); font-weight:500; }
.dup-path-meta  { font-size:11px; color:var(--text-muted); margin-top:2px; }

.dup-badge-fp-high { background:var(--green-bg); border:1px solid var(--green-fg); color:var(--green-fg); display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; font-weight:600; white-space:nowrap; }
.dup-badge-fp-med  { background:var(--amber-bg); border:1px solid var(--amber-fg); color:var(--amber-fg); display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; font-weight:600; white-space:nowrap; }
.dup-badge-fp-low  { background:var(--red-bg);   border:1px solid var(--red-fg);   color:var(--red-fg);   display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; font-weight:600; white-space:nowrap; }
.dup-badge-method  { background:var(--grey-bg); color:var(--grey-fg); display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; white-space:nowrap; }

.dup-dec-cell { white-space:nowrap; vertical-align:middle !important; }
.dup-dec-btn  { font-size:11px; padding:3px 8px; border-radius:4px; cursor:pointer; border:1px solid; background:none; transition:all .1s; margin-right:2px; margin-bottom:2px; display:inline-block; }
.dup-keep-u { border-color:var(--blue-fg); color:var(--blue-fg); }
.dup-keep-u:hover, .dup-keep-u.dec-active { background:var(--blue-bg); }
.dup-keep-l { border-color:var(--accent); color:var(--accent); }
.dup-keep-l:hover, .dup-keep-l.dec-active { background:var(--accent-dim); }
.dup-skip   { border-color:var(--border-dark); color:var(--text-muted); }
.dup-skip:hover, .dup-skip.dec-active { background:var(--grey-bg); }
.dup-dec-mark { font-size:11px; color:var(--green-fg); display:block; margin-top:2px; }
.dup-no-rows  { text-align:center; padding:40px; color:var(--text-muted); }

#dup-dec-panel {
  position:fixed; bottom:0; left:0; right:0;
  background:var(--surface); border-top:2px solid var(--border-dark);
  padding:10px 20px; align-items:center; gap:14px; z-index:50;
  box-shadow:0 -2px 8px rgba(0,0,0,.12);
}
.dp2-stat { font-size:13px; color:var(--text-muted); }
.dp2-stat strong { color:var(--text); }
.dp2-clear { padding:6px 14px; border-radius:var(--radius); border:1px solid var(--border-dark); background:var(--surface); cursor:pointer; font-size:12px; color:var(--text); }
.dp2-clear:hover { border-color:var(--accent); }
.dp2-download { padding:6px 14px; border-radius:var(--radius); border:none; background:var(--accent); color:#fff; cursor:pointer; font-size:12px; font-weight:500; margin-left:auto; }
.dp2-download:hover:not(:disabled) { background:#1d4ed8; }
.dp2-download:disabled { opacity:.35; cursor:default; }

#dup-toast {
  position:fixed; bottom:65px; left:50%; transform:translateX(-50%) translateY(8px);
  background:var(--surface); border:1px solid var(--accent); color:var(--text);
  padding:9px 18px; border-radius:var(--radius); font-size:13px;
  opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; z-index:100;
  box-shadow:var(--shadow);
}
#dup-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── Library Dupes View ──────────────────────────────────────────────────────── */
.dup-undo-cmd-btn { margin-left:auto; border-color:var(--accent) !important; color:var(--accent); }
.dup-undo-cmd-btn:hover { background:var(--accent-dim); }

.ld-toolbar    { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
.ld-view-tabs  { display:flex; gap:4px; }
.ld-view-tab   { padding:4px 12px; border-radius:var(--radius); border:1px solid var(--border-dark); background:var(--surface); font-size:12px; cursor:pointer; color:var(--text-muted); }
.ld-view-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }

.ld-method-pill { background:var(--surface); border:1px solid var(--border-dark); border-radius:20px; padding:3px 12px; font-size:12px; cursor:pointer; white-space:nowrap; color:var(--text-muted); }
.ld-method-pill.active { border-color:var(--accent); background:var(--accent-dim); color:var(--accent); }

.ld-sort-sel { font-size:12px; padding:3px 8px; background:var(--surface); border:1px solid var(--border-dark); border-radius:var(--radius); color:var(--text); cursor:pointer; }
.ld-count { font-size:12px; color:var(--text-muted); margin-left:auto; }

.ld-pair-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; box-shadow:var(--shadow); }
.ld-pair-card.ld-decided { border-color:var(--green-fg); }
.ld-pair-header { display:flex; gap:8px; align-items:center; padding:8px 12px; background:var(--thead-bg); border-bottom:1px solid var(--border); flex-wrap:wrap; }
.ld-pair-files { display:grid; grid-template-columns:1fr 1fr; gap:0; }
.ld-file-panel { padding:10px 14px; border-right:1px solid var(--border); }
.ld-file-panel:last-child { border-right:none; }
.ld-file-name   { font-size:13px; font-weight:500; color:var(--text); word-break:break-all; }
.ld-file-folder { font-size:11px; color:var(--accent); margin-top:2px; }
.ld-file-meta   { font-size:11px; color:var(--text-muted); margin-top:3px; display:flex; gap:4px; flex-wrap:wrap; }
